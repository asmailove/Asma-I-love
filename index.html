<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ For Asma ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff0080,#ff4d6d,#c850c0,#ff5e62);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
text-align:center;
padding:20px;
z-index:2;
}

.title{
font-size:60px;
font-weight:900;
color:white;
text-shadow:0 0 15px white,0 0 40px #ff4d6d;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{transform:scale(1.05);}
}

.hint{
margin-top:10px;
font-size:22px;
color:white;
}

.numbers{
margin-top:35px;
display:grid;
grid-template-columns:repeat(5,70px);
gap:12px;
justify-content:center;
}

.btn{
width:70px;
height:70px;
border:none;
border-radius:20px;
font-size:24px;
font-weight:bold;
cursor:pointer;
color:white;
background:rgba(255,255,255,.18);
backdrop-filter:blur(15px);
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.reveal{
display:none;
}

.card{
width:95%;
max-width:500px;
padding:25px;
border-radius:30px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.25);
box-shadow:0 0 30px rgba(255,255,255,.15);
}

.profile{
width:120px;
height:120px;
margin:auto;
border-radius:50%;
overflow:hidden;
border:4px solid white;
box-shadow:0 0 25px white;
}

.profile img{
width:100%;
height:100%;
object-fit:cover;
}

.loveTitle{
font-size:40px;
font-weight:900;
margin-top:15px;
color:white;
text-shadow:0 0 15px white,0 0 40px #ff4d6d;
}

.heart{
position:relative;
font-size:180px;
margin-top:10px;
animation:heartbeat 1.4s infinite;
filter:drop-shadow(0 0 20px #ff1744)
drop-shadow(0 0 60px #ff1744);
}

@keyframes heartbeat{
50%{transform:scale(1.12);}
}

.name{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:24px;
font-weight:900;
color:white;
text-shadow:0 0 10px white,0 0 30px gold;
}

.typing{
height:60px;
margin-top:15px;
font-size:20px;
font-weight:bold;
color:white;
}

.musicBtn{
padding:12px 25px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
margin-top:10px;
color:white;
background:linear-gradient(45deg,#ff006e,#8338ec);
}

.bio{
margin-top:20px;
color:white;
line-height:1.8;
font-size:17px;
}

.floating{
position:absolute;
bottom:-100px;
animation:float linear infinite;
opacity:.8;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-120vh);
opacity:0;
}
}

</style>
</head>
<body>

<!-- PAGE 1 -->

<div class="container" id="page1">

<div class="title">
I LOVE YOU ❤️
</div>

<div class="hint">
✨ Click Number 2 ✨
</div>

<div class="numbers">

<button class="btn">1</button>
<button class="btn" onclick="openLove()">2</button>
<button class="btn">3</button>
<button class="btn">4</button>
<button class="btn">5</button>
<button class="btn">6</button>
<button class="btn">7</button>
<button class="btn">8</button>
<button class="btn">9</button>
<button class="btn">10</button>

</div>

</div>

<!-- PAGE 2 -->

<div class="container reveal" id="page2">

<div class="card">

<div class="profile">
<img src="https://picsum.photos/300">
</div>

<div class="loveTitle">
❤️ ASMA ❤️
</div>

<div class="heart">
❤️
<div class="name">👑 MY QUEEN 👑</div>
</div>

<div class="typing" id="typing"></div>

<button class="musicBtn" onclick="toggleMusic()">
🎵 Play Music
</button>

<div class="bio">
🌹 তুমি আমার জীবনের সবচেয়ে সুন্দর অনুভূতি।<br><br>

তোমাকে ভালোবাসার জন্য কোনো কারণ লাগে না,
কারণ তুমি নিজেই আমার সবচেয়ে প্রিয় কারণ। ❤️<br><br>

✨ সবসময় হৃদয়ের সবচেয়ে বিশেষ জায়গায় থাকবে। ✨
</div>

</div>

</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

function openLove(){

document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="block";

startTyping();

}

let started=false;

function startTyping(){

if(started) return;

started=true;

const text="❤️ You Are My Favourite Person In The World ❤️";

let i=0;

function type(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(type,70);

}

}

type();

}

function toggleMusic(){

let music=document.getElementById("music");

if(music.paused){
music.play();
}else{
music.pause();
}

}

for(let i=0;i<100;i++){

let h=document.createElement("div");

h.className="floating";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(12+Math.random()*30)+"px";

h.style.animationDuration=(5+Math.random()*8)+"s";

h.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(h);

}

</script>

</body>
</html>
